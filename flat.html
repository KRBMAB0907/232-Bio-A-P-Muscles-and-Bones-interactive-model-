<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muscle Atlas 2D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an anatomy plate (front + back figures, muscle or bone layer) on the left, a specimen card / quiz panel on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1b2430; --ink-2:#5a6676; --line:#d5dbe3;
  --skin:#efe2d4; --skin-lo:#dfcbb7; --skin-edge:#bfa38b;
  --m:#c25560; --m-hi:#e69a9c; --m-lo:#99343f; --m-edge:#8e3440; --fib:#6e1f2a; --tendon:#f1ebe2; --tendon-edge:#c9bba8;
  --bone:#f2ead8; --bone-hi:#fffaf0; --bone-edge:#a8957a; --bone-dark:#6d5f4c;
  --sel:#2b6fb0; --deep:#4b6a8a; --accent:#1f6f78; --good:#2f7d4f; --bad:#b03a3a;
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a21; --paper:#1d252f; --ink:#e7ecf2; --ink-2:#9aa7b6; --line:#2e3946;
  --skin:#5c4b40; --skin-lo:#46382f; --skin-edge:#7d685a;
  --m:#a8464f; --m-hi:#d0737a; --m-lo:#7a2a33; --m-edge:#e7a0a5; --fib:#3d0d14; --tendon:#cfc6b8; --tendon-edge:#8f8474;
  --bone:#d9cfba; --bone-hi:#f3ebda; --bone-edge:#8f8068; --bone-dark:#3b342b;
  --sel:#6fb2ef; --deep:#8fb3d6; --accent:#5cc3cc; --good:#6fcf97; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a21; --paper:#1d252f; --ink:#e7ecf2; --ink-2:#9aa7b6; --line:#2e3946;
  --skin:#5c4b40; --skin-lo:#46382f; --skin-edge:#7d685a;
  --m:#a8464f; --m-hi:#d0737a; --m-lo:#7a2a33; --m-edge:#e7a0a5; --fib:#3d0d14; --tendon:#cfc6b8; --tendon-edge:#8f8474;
  --bone:#d9cfba; --bone-hi:#f3ebda; --bone-edge:#8f8068; --bone-dark:#3b342b;
  --sel:#6fb2ef; --deep:#8fb3d6; --accent:#5cc3cc; --good:#6fcf97; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-stretch:85%;font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.01em;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--ink-2);margin:6px 0 0;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:3px}
.seg button{border:0;background:none;color:var(--ink-2);font:600 13px var(--font-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--deep);width:16px;height:16px}
button:focus-visible,input:focus-visible,select:focus-visible,path:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.plate{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 10px 8px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fig{display:flex;flex-direction:column;align-items:center;min-width:0}
.fig svg{width:100%;max-width:320px;height:auto;display:block}
.fig .lbl{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.skin-o{fill:var(--skin-edge);stroke:var(--skin-edge);stroke-width:2;stroke-linejoin:round}
.skin{fill:url(#sk)}
.ghost-o{fill:var(--skin-edge);stroke:var(--skin-edge);stroke-width:1.6;opacity:.35}
.ghost{fill:var(--skin);opacity:.6}
.feat{fill:url(#sk);stroke:var(--skin-edge);stroke-width:.6;pointer-events:none}
.eye{fill:#f7f4ee;stroke:var(--m-lo);stroke-width:.4;pointer-events:none}
.iris{fill:#3d4a57;pointer-events:none}
.lip{fill:none;stroke:var(--m-lo);stroke-width:.8;pointer-events:none}
.teeth{fill:var(--bone-hi);stroke:var(--bone-edge);stroke-width:.5;pointer-events:none}
.tline-b{stroke:var(--bone-edge);stroke-width:.4;pointer-events:none}
.mus{fill:url(#mg);stroke:var(--m-edge);stroke-width:.5;cursor:pointer;filter:url(#sh)}
.mus.deep{filter:none}
.mus:hover{fill:var(--m-hi)}
.fib{pointer-events:none;opacity:.45}
.mus.on{fill:var(--sel);stroke:var(--sel)}
.mus.deep{fill:var(--deep);fill-opacity:.2;stroke:var(--deep);stroke-dasharray:3 2;stroke-width:1}
.mus.deep:hover{fill-opacity:.45}
.mus.deep.on{fill:var(--sel);fill-opacity:.8;stroke:var(--sel);stroke-dasharray:none}
.mus.good,.bone.good{fill:var(--good)} .mus.bad,.bone.bad{fill:var(--bad)}
.tendon{fill:var(--tendon);stroke:var(--tendon-edge);stroke-width:.5;pointer-events:none}
.tline{fill:none;stroke:var(--tendon);stroke-width:1.1;pointer-events:none;opacity:.9}
.bone-o{fill:var(--bone-edge);stroke:var(--bone-edge);stroke-width:1.6;stroke-linejoin:round;pointer-events:none}
.bone{fill:url(#bg);cursor:pointer}
.bone:hover{fill:var(--bone-hi)}
.bone.on{fill:var(--sel)}
.bdec{fill:var(--bone-dark);pointer-events:none;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:12px;color:var(--ink-2);padding-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card h2{font-family:var(--font-display);font-stretch:90%;font-weight:750;font-size:26px;margin:4px 0 12px;line-height:1.1;text-wrap:balance}
dl{margin:0;display:grid;gap:10px}
dt{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
dd{margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px var(--font-body);padding:4px 10px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--ink-2)}
.chip small{font:11px var(--font-mono);color:var(--ink-2);margin-left:4px}
.note{font-size:13px;color:var(--ink-2);margin:12px 0 0}
.empty{color:var(--ink-2);margin:0}
.list{max-height:360px;overflow:auto;border-top:1px solid var(--line);margin-top:10px}
.list h3{font:600 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 4px}
.list button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:14px var(--font-body);padding:4px 6px;border-radius:5px;cursor:pointer}
.list button:hover{background:var(--bg)}
.list button.on{background:var(--ink);color:var(--bg)}
.list button .d{font:11px var(--font-mono);color:var(--deep);margin-left:6px}
.list button.on .d{color:var(--bg)}
#search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:14px var(--font-body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qsel{display:flex;gap:8px;flex-wrap:wrap}
.score{font:500 13px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:13px var(--font-body)}
.prompt{font-family:var(--font-display);font-stretch:90%;font-weight:700;font-size:21px;margin:12px 0;line-height:1.2}
.choices{display:grid;gap:8px}
.choices button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14px var(--font-body);padding:10px 12px;border-radius:8px;cursor:pointer}
.choices button:hover:not(:disabled){border-color:var(--ink-2)}
.choices button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--paper))}
.choices button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--paper))}
.choices button:disabled{cursor:default}
.fb{margin-top:12px;font-size:14px}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.primary{margin-top:12px;border:0;background:var(--accent);color:var(--paper);font:600 14px var(--font-body);padding:10px 16px;border-radius:8px;cursor:pointer}
</style>

</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>Muscle Atlas · 2D plates</h1>
      <p class="sub">BIOL 232 study plate · tap a muscle or bone · <a href="index.html" style="color:var(--accent)">Back to the 3D model</a></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Layer">
        <button id="lM" aria-pressed="true">Muscles</button>
        <button id="lB" aria-pressed="false">Bones</button>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button id="mStudy" aria-pressed="true">Study</button>
        <button id="mQuiz" aria-pressed="false">Quiz</button>
      </div>
      <label class="toggle" id="deepWrap"><input type="checkbox" id="deepT"> Show deep muscles</label>
    </div>
  </header>

  <div class="main">
    <div class="plate">
      <div class="figs">
        <div class="fig"><span class="lbl">Anterior</span><svg id="front" viewBox="18 12 264 642" aria-label="Front view"></svg></div>
        <div class="fig"><span class="lbl">Posterior</span><svg id="back" viewBox="18 12 264 642" aria-label="Back view"></svg></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel">
      <div id="study">
        <div class="card" id="info"></div>
        <div class="card" style="margin-top:14px">
          <input id="search" type="search" placeholder="Search (e.g. humerus, flexes the knee)" aria-label="Search">
          <div class="list" id="list"></div>
        </div>
      </div>
      <div id="quiz" hidden>
        <div class="card">
          <div class="qhead">
            <div class="qsel">
              <select id="qTopic" aria-label="Quiz topic"><option value="m">Muscles</option><option value="b">Bones</option></select>
              <select id="qType" aria-label="Question type"></select>
            </div>
            <span class="score" id="score">0 / 0</span>
          </div>
          <div id="qBody"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ---------- geometry helpers ----------
const fx=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
function sc(p){const n=p.length;let d='M'+fx(p[0]);for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
  d+='C'+fx([p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6])+' '+fx([p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6])+' '+fx(p2)}return d+'Z'}
const B=(pts,a=90)=>({d:sc(pts),a});
function S(x1,y1,x2,y2,w,b=.45){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,ts=[.06,.16,.28,.42,.56,.7,.83,.94],l=[],r=[];
  for(const t of ts){const s=t<b?t/b*.5:.5+(t-b)/(1-b)*.5,h=w/2*Math.pow(Math.sin(Math.PI*s),.8)+.35,cx=x1+dx*t,cy=y1+dy*t;l.push([cx+nx*h,cy+ny*h]);r.push([cx-nx*h,cy-ny*h])}
  return {d:sc([[x1,y1],...l,[x2,y2],...r.reverse()]),a:Math.atan2(dy,dx)*180/Math.PI}}
function Bd(cl,w,taper=.7){const n=cl.length,l=[],r=[];for(let i=0;i<n;i++){const a=cl[Math.max(0,i-1)],b=cl[Math.min(n-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,k=(i===0||i===n-1)?taper:1,h=w/2*k;
  l.push([cl[i][0]-dy/L*h,cl[i][1]+dx/L*h]);r.push([cl[i][0]+dy/L*h,cl[i][1]-dx/L*h])}
  const A=cl[0],Z=cl[n-1];return {d:sc([...l,...r.reverse()]),a:Math.atan2(Z[1]-A[1],Z[0]-A[0])*180/Math.PI}}
function E(cx,cy,rx,ry,rot=0){const p=[],c=Math.cos(rot*Math.PI/180),s=Math.sin(rot*Math.PI/180);for(let i=0;i<14;i++){const t=i/14*Math.PI*2,x=rx*Math.cos(t),y=ry*Math.sin(t);p.push([cx+x*c-y*s,cy+x*s+y*c])}return {d:sc(p),a:(ry>rx?rot+90:rot)}}

const HEAD=sc([[150,20],[165,23],[176,32],[181,46],[181,60],[179,70],[174,82],[165,92],[156,97],[150,98],[144,97],[135,92],[126,82],[121,70],[119,60],[119,46],[124,32],[135,23]]);

  sc([[41,334],[59,334],[61,350],[60,368],[57,377],[41,377],[38,362],[39,346]]),

const M=[
{id:'frontalis',n:'Frontalis',g:'Head and face',o:'Epicranial aponeurosis',i:'Skin of eyebrows',a:'Raises eyebrows, wrinkles forehead',c:1,s:{f:[B([[128,42],[134,29],[150,24],[166,29],[172,42],[162,49],[150,45],[138,49]],90)]}},
{id:'temporalis',n:'Temporalis',g:'Head and face',o:'Temporal fossa (temporal, parietal, frontal and sphenoid bones)',i:'Coronoid process of mandible',a:'Elevates and retracts mandible',s:{f:[B([[122,40],[130,38],[132,54],[127,66],[121,57]],80)]}},
{id:'oculi',n:'Orbicularis oculi',g:'Head and face',o:'Frontal bone, maxilla and lacrimal bone (medial wall of the orbit)',i:'Skin around the eyelids',a:'Closes the eye (blinking, squinting)',s:{f:[E(139,58,7.5,5.2)]}},
{id:'zygo',n:'Zygomaticus major',g:'Head and face',o:'Zygomatic bone',i:'Corner of the mouth',a:'Raises corner of mouth (smiling)',s:{f:[S(129,66,141,83,3.4)]}},
{id:'masseter',n:'Masseter',g:'Head and face',o:'Zygomatic arch and zygomatic process of maxilla',i:'Angle and ramus of mandible',a:'Elevates mandible (closes jaw)',s:{f:[B([[123,68],[131,68],[134,84],[129,91],[123,81]],80)]}},
{id:'oris',n:'Orbicularis oris',g:'Head and face',o:'Maxilla and mandible',i:'Skin and muscle at corners of mouth',a:'Closes and puckers the lips',c:1,s:{f:[E(150,85,8.5,3.8)]}},
{id:'bucc',n:'Buccinator',g:'Head and face',o:'Maxilla and mandible (molar region)',i:'Orbicularis oris',a:'Compresses cheek (whistling, chewing)',d:1,s:{f:[E(135,81,4,3)]}},
{id:'scm',n:'Sternocleidomastoid',g:'Neck',o:'Manubrium of sternum and medial clavicle',i:'Mastoid process of temporal bone and superior nuchal line of occipital bone',a:'Both sides: flex neck. One side: rotates head to the opposite side',s:{f:[S(126,72,146,117,7,.5)]}},
{id:'platysma',n:'Platysma',g:'Neck',o:'Fascia over pectoralis major and deltoid',i:'Mandible and skin of lower face',a:'Tenses neck skin, depresses mandible',s:{f:[B([[140,100],[126,108],[110,119],[124,125],[142,114]],150)]}},
{id:'splenius',n:'Splenius capitis',g:'Neck',o:'Ligamentum nuchae, spinous processes C7–T3',i:'Mastoid process and occipital bone',a:'Extends and rotates the head',s:{b:[S(148,114,131,74,8)]}},
{id:'trap',n:'Trapezius',g:'Trunk and back',o:'Occipital bone, ligamentum nuchae, spinous processes C7–T12',i:'Clavicle, acromion and spine of scapula',a:'Elevates, retracts, depresses and rotates the scapula',

{id:'levator',n:'Levator scapulae',g:'Trunk and back',o:'Transverse processes C1–C4',i:'Superior medial border of scapula',a:'Elevates the scapula',d:1,s:{b:[S(140,80,124,128,5.5)]}},
{id:'erector',n:'Erector spinae',g:'Trunk and back',o:'Iliac crest, sacrum, vertebrae and ribs',i:'Ribs, vertebrae and skull',a:'Extends and laterally flexes the vertebral column',d:1,s:{b:[B([[140,170],[148,170],[148,340],[139,340],[137,250]],90)]}},

{id:'pecmaj',n:'Pectoralis major',g:'Chest and breathing',o:'Clavicle, sternum, costal cartilages 1–6',i:'Lateral lip of intertubercular groove (crest of greater tubercle) of humerus',a:'Flexes, adducts and medially rotates the arm',s:{f:[B([[149,118],[132,117],[112,121],[96,132],[90,148],[94,166],[104,177],[122,187],[140,191],[149,189]],-10)]}},

{id:'humerus',n:'Humerus',g:'Upper limb',w:'Upper arm',l:'About 33 cm',p:'Lever for shoulder and elbow movement',t:'Long',s:{f:humerus,b:humerus},
  att:{o:['brachialis','triceps','pronator','fcr','fcu','pl','fds','brachiorad','ecrl','ecu','ed','supinator'],i:['supra','infra','tmin','subscap','pecmaj','lats','tmaj','delt','coraco']}},
{id:'radius',n:'Radius',g:'Upper limb',w:'Forearm, thumb side',l:'About 24 cm',p:'Rotates for pronation and supination; forms the wrist joint',t:'Long',s:{f:radius,b:radius},att:{o:['fds'],i:['biceps','pronator','supinator','brachiorad']}},
{id:'ulna',n:'Ulna',g:'Upper limb',w:'Forearm, little-finger side',l:'About 26 cm',p:'Forms the main elbow hinge (olecranon)',t:'Long',s:{f:ulna,b:ulna},att:{o:['fcu','fds','supinator','pronator'],i:['triceps','brachialis']}},
{id:'carpals',n:'Carpals (8)',g:'Upper limb',w:'Wrist',l:'1–2 cm each',p:'Flexible wrist movement',t:'Short',s:{f:carp,b:carp},att:{o:[],i:['fcu']}},
{id:'metacarpals',n:'Metacarpals (5)',g:'Upper limb',w:'Palm',l:'5–7 cm',p:'Frame of the hand',t:'Long',s:{f:meta,b:meta},att:{o:[],i:['fcr','fcu','ecrl','ecu']}},
{id:'hphal',n:'Phalanges of hand (14)',g:'Upper limb',w:'Fingers',l:'2–5 cm',p:'Gripping and fine movement',t:'Long',s:{f:hph,b:hph},att:{o:[],i:['fds','ed']}},
{id:'pelvis',n:'Pelvis (os coxae)',g:'Lower limb',w:'Hips (ilium, ischium, pubis)',l:'About 25 cm wide',p:'Supports the trunk, protects pelvic organs, socket for the femur',t:'Irregular',s:{f:pelvF,b:pelvB},
  att:{o:['iliopsoas','gmax','gmed','gmin','tfl','sart','rf','lats','intob','transab','ql','erector','bf','st','sm','addm','rectab','addl','addb','gracilis'],i:['extob']}},
{id:'femur',n:'Femur',g:'Lower limb',w:'Thigh',l:'About 48 cm (longest, strongest bone)',p:'Supports body weight; lever for walking and running',t:'Long',s:{f:femur,b:femur},
  att:{o:['vl','vm','vi','bf','gastroc'],i:['gmed','gmin','piri','iliopsoas','addl','addb','addm','gmax']}},
{id:'patella',n:'Patella',g:'Lower limb',w:'Front of knee',l:'About 5 cm',p:'Protects the knee; improves the pull of the quadriceps (the quadriceps tendon wraps over it)',t:'Sesamoid',s:{f:[E(126,482,7,8.5)]},att:{o:[],i:['rf','vl','vm','vi']}},
{id:'tibia',n:'Tibia',g:'Lower leg',w:'Shin, inner side',l:'About 40 cm',p:'Main weight-bearing bone of the lower leg',t:'Long',s:{f:tibia,b:tibia},att:{o:['ta','tp','soleus','edl'],i:['rf','vl','vm','vi','sart','gracilis','st','sm','bf']}},
{id:'fibula',n:'Fibula',g:'Lower leg',w:'Lower leg, outer side',l:'About 40 cm, thin',p:'Muscle attachment; stabilises the ankle; bears little weight',t:'Long',s:{f:fibula,b:fibula},att:{o:['fl','fb','soleus','tp','edl'],i:['bf']}},
{id:'tarsals',n:'Tarsals (7)',g:'Lower leg',w:'Ankle and heel (talus, calcaneus and others)',l:'Calcaneus about 8 cm',p:'Transfer weight to the foot; the heel anchors the Achilles tendon',t:'Short',s:{f:tarF,b:tarB},att:{o:[],i:['gastroc','soleus','ta','tp','fl']}},
{id:'metatarsals',n:'Metatarsals (5)',g:'Lower leg',w:'Middle of foot',l:'6–8 cm',p:'Form the arches; push-off in walking',t:'Long',s:{f:metaT},att:{o:[],i:['ta','fl','fb','tp']}},
{id:'fphal',n:'Phalanges of foot (14)',g:'Lower leg',w:'Toes',l:'1–3 cm',p:'Balance and push-off',t:'Long',s:{f:fph},att:{o:[],i:['edl']}},
];
const BORDER={f:['spine','ribs','sternum','pelvis','femur','patella','tibia','fibula','tarsals','metatarsals','fphal','humerus','radius','ulna','carpals','metacarpals','hphal','scapula','clavicle','skull','mandible'],
  b:['ribs','scapula','clavicle','spine','pelvis','femur','tibia','fibula','tarsals','humerus','radius','ulna','carpals','metacarpals','hphal','skull']};

const byId={};M.forEach(m=>{m.kind='m';byId[m.id]=m});BONES.forEach(b=>{b.kind='b';byId[b.id]=b});
M.forEach(m=>m.bones=[]);BONES.forEach(b=>{b.att.o.forEach(id=>byId[id].bones.push({id:b.id,r:'origin'}));b.att.i.forEach(id=>byId[id].bones.push({id:b.id,r:'insertion'}))});

// ---------- render ----------
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},cls)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(cls)e.setAttribute('class',cls);return e};
const MIR='translate(300 0) scale(-1 1)';
function defs(svg){const d=el('defs');
  d.innerHTML=`<radialGradient id="mg" cx="45%" cy="40%" r="65%"><stop offset="0" style="stop-color:var(--m-hi)"/><stop offset=".7" style="stop-color:var(--m)"/><stop offset="1" style="stop-color:var(--m-lo)"/></radialGradient>
  <radialGradient id="bg" cx="40%" cy="35%" r="70%"><stop offset="0" style="stop-color:var(--bone-hi)"/><stop offset="1" style="stop-color:var(--bone)"/></radialGradient>
  <linearGradient id="sk" x1="0" x2="1"><stop offset="0" style="stop-color:var(--skin-lo)"/><stop offset=".5" style="stop-color:var(--skin)"/><stop offset="1" style="stop-color:var(--skin-lo)"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy=".7" stdDeviation=".7" flood-color="#2a0a0e" flood-opacity=".35"/></filter>`;
  for(let a=0;a<180;a+=15){d.insertAdjacentHTML('beforeend',`<pattern id="f${a}" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(${a})"><line x1="0" y1="1" x2="2" y2="1" style="stroke:var(--fib)" stroke-width=".4"/></pattern>`)}
  svg.appendChild(d)}
const fibId=a=>{a=((Math.round(a/15)*15)%180+180)%180;return 'f'+a};
function addShape(parent,item,sh,mirror,cls,withFib){
  const g=mirror?el('g',{transform:MIR}):parent;if(mirror)parent.appendChild(g);
  const p=el('path',{d:sh.d,tabindex:'0',role:'button','aria-label':item.n},cls);p.dataset.id=item.id;
  const t=el('title');t.textContent=item.n;p.appendChild(t);g.appendChild(p);
  if(withFib){const f=el('path',{d:sh.d},'fib');f.style.fill=`url(#${fibId(sh.a)})`;g.appendChild(f)}
}
const both=(parent,d,cls)=>{parent.appendChild(el('path',{d},cls));const g=el('g',{transform:MIR});g.appendChild(el('path',{d},cls));parent.appendChild(g)};
function skin(cls){const g=el('g');
  // outline pass then fill pass, so hands, ears and body merge into one silhouette
  for(const pass of [cls+'-o',cls]){g.appendChild(el('path',{d:OUTLINE},pass));g.appendChild(el('path',{d:HEAD},pass));SKINP.forEach(d=>both(g,d,pass))}
  return g}
function face(g){
  [139,161].forEach(x=>{g.appendChild(el('ellipse',{cx:x,cy:58,rx:4.2,ry:2.1},'eye'));g.appendChild(el('circle',{cx:x,cy:58,r:1.5},'iris'))});
  g.appendChild(el('path',{d:sc([[147,58],[153,58],[155.5,72],[153,76],[150,77],[147,76],[144.5,72]])},'feat'));
  g.appendChild(el('path',{d:'M144,85 Q150,87.5 156,85'},'lip'));
}
function build(svgId,v){
  const svg=document.getElementById(svgId);defs(svg);
  const mL=el('g',{},'layer-m');mL.appendChild(skin('skin'));
  const un=el('g'),sup=el('g'),tl=el('g'),dp=el('g',{},'deepLayer');
  (UNDER[v]||[]).forEach(sh=>both(un,sh.d,'tendon'));
  const seen=new Set();
  const draw=(m)=>{if(!m.s[v]||seen.has(m.id))return;seen.add(m.id);
    for(const sh of m.s[v])for(const mir of (m.c?[0]:[0,1]))addShape(m.d?dp:sup,m,sh,mir,'mus'+(m.d?' deep':''),!m.d)};
  ORDER[v].forEach(id=>draw(byId[id]));M.filter(m=>!m.d).forEach(draw);
  (TENDONS[v]||[]).forEach(sh=>both(tl,sh.d,'tendon'));
  (TLINES[v]||[]).forEach(d=>both(tl,d,'tline'));
  if(v==='f')face(tl);
  M.filter(m=>m.d).forEach(draw);
  mL.append(un,sup,tl,dp);svg.appendChild(mL);
  const bL=el('g',{},'layer-b');bL.appendChild(skin('ghost'));
  for(const id of BORDER[v]){const b=byId[id];if(!b.s[v])continue;
    for(const mir of (b.c?[0]:[0,1])){const og=el('g',mir?{transform:MIR}:{});b.s[v].forEach(sh=>og.appendChild(el('path',{d:sh.d},'bone-o')));bL.appendChild(og)}
    for(const sh of b.s[v])for(const mir of (b.c?[0]:[0,1]))addShape(bL,b,sh,mir,'bone',false);
    if(id==='skull'&&v==='f')BDEC.skull.forEach(sh=>bL.appendChild(el('path',{d:sh.d},'bdec')));
    if(id==='mandible'&&v==='f'){bL.appendChild(el('path',{d:TEETH.d},'teeth'));for(let x=141;x<=159;x+=3)bL.appendChild(el('path',{d:`M${x},74.5 L${x},82`},'tline-b'))}
    if(id==='pelvis'&&v==='f')both(bL,BDEC.pelvis.d,'bdec');
  }
  svg.appendChild(bL);
}
build('front','f');build('back','b');
// ---------- state ----------
let layer='m',mode='study',deep=false,sel=null,quizState=null,score={r:0,t:0};
function setDeepVisible(){document.querySelectorAll('.deepLayer .mus').forEach(e=>{e.style.display=(deep||e.matches('.on,.good,.bad'))?'':'none'})}
function mark(id,cls='on'){document.querySelectorAll('.'+cls+'[data-id]').forEach(e=>e.classList.remove(cls));if(id)document.querySelectorAll(`[data-id="${id}"]`).forEach(e=>e.classList.add(cls));setDeepVisible()}
function clearMarks(){['on','good','bad'].forEach(c=>document.querySelectorAll('.'+c+'[data-id]').forEach(e=>e.classList.remove(c)));setDeepVisible()}
const legend=document.getElementById('legend');
function setLayer(l){layer=l;document.getElementById('lM').setAttribute('aria-pressed',l==='m');document.getElementById('lB').setAttribute('aria-pressed',l==='b');
  document.querySelectorAll('.layer-m').forEach(g=>g.style.display=l==='m'?'':'none');document.querySelectorAll('.layer-b').forEach(g=>g.style.display=l==='b'?'':'none');
  document.getElementById('deepWrap').style.visibility=l==='m'?'':'hidden';
  legend.innerHTML=l==='m'?'<span><i style="background:var(--m)"></i>Superficial</span><span><i style="background:var(--deep);opacity:.6"></i>Deep (dashed)</span><span><i style="background:var(--tendon);border:1px solid var(--tendon-edge)"></i>Tendon</span><span><i style="background:var(--sel)"></i>Selected</span>'
    :'<span><i style="background:var(--bone);border:1px solid var(--bone-edge)"></i>Bone</span><span><i style="background:var(--sel)"></i>Selected</span>';
  renderList();}

// ---------- study ----------
const info=document.getElementById('info');
const nameOf=id=>byId[id].n;
function showInfo(id){
  const x=byId[id];if(x.kind!==layer)setLayer(x.kind);sel=id;mark(id);
  if(x.kind==='m'){
    const views=['f','b'].filter(v=>x.s[v]).map(v=>v==='f'?'front':'back').join(' and ');
    info.innerHTML=`<div class="eyebrow">${x.g}${x.d?' · deep':''}</div><h2>${x.n}</h2>
    <dl><div><dt>Origin</dt><dd>${x.o}</dd></div><div><dt>Insertion</dt><dd>${x.i}</dd></div><div><dt>Action</dt><dd>${x.a}</dd></div>
    <div><dt>Attaches to</dt><dd class="chips">${x.bones.map(b=>`<button class="chip" data-go="${b.id}">${nameOf(b.id)}<small>${b.r}</small></button>`).join('')}</dd></div></dl>
    <p class="note">Shown on the ${views} view.${x.d?' Deep muscles sit under the surface layer and show as dashed outlines.':''} Tap a bone to see it on the skeleton.</p>`;
  }else{
    const ch=ids=>ids.length?ids.map(m=>`<button class="chip" data-go="${m}">${nameOf(m)}</button>`).join(''):'<span class="empty">None in this guide</span>';
    info.innerHTML=`<div class="eyebrow">${x.g} · ${x.t}</div><h2>${x.n}</h2>
    <dl><div><dt>Where it is</dt><dd>${x.w}</dd></div><div><dt>Approx. adult length</dt><dd>${x.l}</dd></div><div><dt>Purpose</dt><dd>${x.p}</dd></div>
    <div><dt>Muscles that start here (origin)</dt><dd class="chips">${ch(x.att.o)}</dd></div>
    <div><dt>Muscles that attach here (insertion)</dt><dd class="chips">${ch(x.att.i)}</dd></div></dl>
    <p class="note">Lengths are rough adult averages; go by the textbook if it differs. Tap a muscle to see it on the body.</p>`;
  }
  renderList();
}
info.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)showInfo(b.dataset.go)});
function idle(){info.innerHTML=`<p class="empty">${layer==='m'?'Tap a muscle on the figure or pick one from the list.':'Tap a bone on the skeleton or pick one from the list.'}</p>`}
const listEl=document.getElementById('list'),search=document.getElementById('search');
function renderList(){
  const q=search.value.trim().toLowerCase(),src=layer==='m'?M:BONES,groups={};
  for(const x of src){const hay=(layer==='m'?[x.n,x.o,x.i,x.a,x.g]:[x.n,x.w,x.p,x.g,x.t]).join(' ').toLowerCase();if(q&&!hay.includes(q))continue;(groups[x.g]=groups[x.g]||[]).push(x)}
  listEl.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([g,xs])=>`<h3>${g}</h3>`+xs.map(x=>`<button data-id="${x.id}" class="${x.id===sel?'on':''}">${x.n}${x.d?'<span class="d">deep</span>':''}</button>`).join('')).join(''):'<p class="empty" style="padding:10px 4px">Nothing matches that search.</p>';
}
listEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)showInfo(b.dataset.id)});
search.addEventListener('input',renderList);
function onFigure(e){const t=e.target.closest('[data-id]');if(!t)return;if(mode==='study')showInfo(t.dataset.id);else quizClick(t.dataset.id)}
['front','back'].forEach(id=>{const s=document.getElementById(id);s.addEventListener('click',onFigure);s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onFigure(e)}})});
document.getElementById('lM').onclick=()=>{if(mode==='quiz'){qTopic.value='m';fillTypes();newQuestion()}else{setLayer('m');sel&&byId[sel].kind==='m'?mark(sel):(clearMarks(),idle())}};
document.getElementById('lB').onclick=()=>{if(mode==='quiz'){qTopic.value='b';fillTypes();newQuestion()}else{setLayer('b');sel&&byId[sel].kind==='b'?mark(sel):(clearMarks(),idle())}};
document.getElementById('deepT').addEventListener('change',e=>{deep=e.target.checked;setDeepVisible()});
const bS=document.getElementById('mStudy'),bQ=document.getElementById('mQuiz');
function setMode(m){mode=m;bS.setAttribute('aria-pressed',m==='study');bQ.setAttribute('aria-pressed',m==='quiz');
  document.getElementById('study').hidden=m!=='study';document.getElementById('quiz').hidden=m!=='quiz';clearMarks();
  if(m==='quiz'){qTopic.value=layer;fillTypes();newQuestion()}else if(sel)showInfo(sel);else idle()}
bS.onclick=()=>setMode('study');bQ.onclick=()=>setMode('quiz');

// ---------- quiz ----------
const qBody=document.getElementById('qBody'),qType=document.getElementById('qType'),qTopic=document.getElementById('qTopic'),scoreEl=document.getElementById('score');
const TYPES={m:[['mix','Mixed'],['name','Name the muscle'],['find','Find it on the body'],['o','Origin'],['i','Insertion'],['a','Action'],['bone','Which bone it attaches to']],
  b:[['mix','Mixed'],['name','Name the bone'],['find','Find it on the skeleton'],['p','Purpose'],['w','Where it is'],['mus','Which muscle attaches here']]};
const LABEL={o:'origin',i:'insertion',a:'action',p:'purpose',w:'location'};
function fillTypes(){qType.innerHTML=TYPES[qTopic.value].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}
qTopic.addEventListener('change',()=>{fillTypes();newQuestion()});qType.addEventListener('change',newQuestion);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let last=null;
function newQuestion(){
  const topic=qTopic.value;setLayer(topic);clearMarks();
  let type=qType.value;if(type==='mix')type=pick(TYPES[topic].slice(1).map(x=>x[0]));
  let pool=topic==='m'?M:BONES;
  if(type==='find'&&topic==='m')pool=pool.filter(m=>deep||!m.d);
  if(type==='bone')pool=M.filter(m=>m.bones.length);
  if(type==='mus')pool=BONES.filter(b=>b.att.o.length+b.att.i.length);
  let t;do{t=pick(pool)}while(t.id===last&&pool.length>1);last=t.id;
  quizState={type,t,done:false};
  if(type==='find'){qBody.innerHTML=`<p class="prompt">Tap the <span style="color:var(--accent)">${t.n}</span>.</p><p class="note">Check both the front and back views.${t.d?' This is a deep muscle; turn on "Show deep muscles".':''}</p><div id="fb"></div>`;return}
  mark(t.id);
  let opts,right,q;
  if(type==='bone'){const pb=pick(t.bones);right=nameOf(pb.id);q=`Which bone does the <span style="color:var(--accent)">${t.n}</span> attach to?`;
    opts=[right,...shuffle(BONES.filter(b=>!t.bones.some(x=>x.id===b.id))).slice(0,3).map(b=>b.n)];}
  else if(type==='mus'){const all=[...t.att.o,...t.att.i];right=nameOf(pick(all));q=`Which muscle attaches to the <span style="color:var(--accent)">${t.n}</span>?`;
    opts=[right,...shuffle(M.filter(m=>!all.includes(m.id))).slice(0,3).map(m=>m.n)];}
  else{const f=type==='name'?'n':type;right=t[f];
    q=type==='name'?`Which ${topic==='m'?'muscle':'bone'} is highlighted?`:`What is the ${LABEL[type]} of the <span style="color:var(--accent)">${t.n}</span>?`;
    const src=topic==='m'?M:BONES,same=shuffle(src.filter(x=>x.id!==t.id&&x.g===t.g)),other=shuffle(src.filter(x=>x.id!==t.id&&x.g!==t.g));
    opts=[right];for(const x of same.concat(other)){if(opts.length>=4)break;if(!opts.includes(x[f]))opts.push(x[f])}}
  quizState.right=right;
  qBody.innerHTML=`<p class="prompt">${q}</p><div class="choices">${shuffle(opts).map(o=>`<button>${o}</button>`).join('')}</div><div id="fb"></div>`;
  qBody.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>answer(b));
}
function explain(t){return t.kind==='m'?`<div class="fb"><b>${t.n}</b> · Origin: ${t.o}. Insertion: ${t.i}. Action: ${t.a}.</div>`
  :`<div class="fb"><b>${t.n}</b> · ${t.w}. ${t.l}. ${t.p}.</div>`}
function finish(ok,t){score.t++;if(ok)score.r++;scoreEl.textContent=`${score.r} / ${score.t}`;quizState.done=true;
  const fb=document.getElementById('fb');fb.innerHTML=`<div class="fb"><b class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</b></div>`+explain(t)+`<button class="primary" id="next">Next question</button>`;
  const n=document.getElementById('next');n.onclick=newQuestion;n.focus()}
function answer(b){if(quizState.done)return;const {t,right}=quizState;
  qBody.querySelectorAll('.choices button').forEach(x=>{x.disabled=true;if(x.textContent===right)x.classList.add('right')});
  const ok=b.textContent===right;if(!ok)b.classList.add('wrong');finish(ok,t)}
function quizClick(id){if(!quizState||quizState.type!=='find'||quizState.done)return;const t=quizState.t,ok=id===t.id;if(!ok)mark(id,'bad');mark(t.id,'good');finish(ok,t)}

setLayer('m');setDeepVisible();idle();
</script>
</body>
</html>
